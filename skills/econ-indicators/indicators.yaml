# indicators.yaml
#
# 15 categories from the user's spec, flattened into individual series
# (each row in Google Sheets = one series). `category` groups them back
# together for readability / summary reporting.
#
# STILL NEEDS:
#   - series_id / org_id / table code for every entry marked TODO
#     (assigned as a research task to Claude Code, per user — verify later)
#   - sheet_range for every entry (depends on final Google Sheet layout)
#   - new fetcher modules for sources not yet built: customs, krx, fred
#     (existing: bok_ecos, kosis). All three new sources use free open APIs
#     that require an API key.
#     * "customs" = 공공데이터포털(data.go.kr) 관세청 수출입무역통계 API
#       (NOT the UNI-PASS customs portal — data.go.kr is the right one for
#       monthly trade balance / exports / imports / HS-code item stats)
#
# frequency values used: quarterly | monthly | annual
# Retention: "latest 10 years" = 10 annual / 40 quarterly / 120 monthly
# data points per series (see settings.retain_periods_by_frequency below).

indicators:
