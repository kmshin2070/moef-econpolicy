    frequency: quarterly
    unit: "%"
    series_id: "200Y102/10211"  # ECOS stat 200Y102 "2.1.1.2. 주요지표(분기지표)", item 10211 "국내총생산(GDP)(실질,원계열,전년동기비)" - HIGH confidence: live-verified via ECOS sample-key call, value 3.7 for 2026Q2 matched published figure - verify before first run
    sheet_range: "TODO"

  - id: gdp_qoq
