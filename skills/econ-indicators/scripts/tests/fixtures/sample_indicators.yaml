# Trimmed fixture for tests / --dry-run smoke checks. Covers:
#   - a normal bok_ecos monthly indicator (cpi_mom)
#   - a normal bok_ecos quarterly indicator (gdp_yoy)
#   - one indicator deliberately left "TODO" (kospi) to exercise
#     pending_configuration
#   - retention windows narrower than mock_fetchers.py's 3-period fixed
#     output, so sliding_window trimming is actually exercised (the mock
#     fetcher always returns 3 periods per frequency; retain=2 here forces
#     the oldest one to be dropped)

indicators:
  - id: cpi_mom
    category: "CPI"
    name: "소비자물가지수 (전월대비, MoM)"
    source: bok_ecos
    frequency: monthly
    unit: "%"
    series_id: "901Y009/0"

  - id: gdp_yoy
    category: "GDP Growth Rate"
    name: "GDP 성장률 (전년동기대비, YoY)"
    source: bok_ecos
    frequency: quarterly
    unit: "%"
    series_id: "200Y102/10211"

  - id: kospi
    category: "Stock Price"
    name: "코스피 (월말 종가)"
    source: krx
    frequency: monthly
    unit: "p"
    series_id: "TODO"

settings:
  header_row: 1
  # Deliberately smaller than mock_fetchers.py's fixed 3-period output so
  # the sliding-window trimming behavior is actually exercised during
  # --dry-run / tests.
  retain_periods_by_frequency:
    annual: 3
    quarterly: 2
    monthly: 2
